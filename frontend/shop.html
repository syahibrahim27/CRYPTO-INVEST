<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Crypto Invest — Toko</title>
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div class="container">
<header class="header"><div class="brand">Toko</div></header>
<section class="grid" style="margin-top:16px">
<div id="productGrid" class="grid grid-3"></div>
</section>
</div>


<!-- Modal Detail -->
<div id="modal" class="modal">
<div class="box">
<div class="kv"><div class="title" id="mTitle"></div> <button class="btn" id="mClose">Tutup</button></div>
<img id="mImg" class="pimg" style="height:220px; margin-top:8px"/>
<p class="subtitle" id="mDesc" style="margin-top:8px"></p>
<div class="grid grid-2" style="margin-top:8px">
<div class="card"><div class="subtitle">Harga</div><div id="mPrice" class="price"></div></div>
<div class="card"><div class="subtitle">Durasi</div><div id="mDur" class="price"></div></div>
</div>
<div class="kv" style="margin-top:8px">
<div class="small">Profit harian: <b id="mDay"></b></div>
<div class="small">Profit total: <b id="mTotal"></b></div>
</div>
<button class="btn btn-primary" id="mBuy" style="width:100%; margin-top:12px">Beli Sekarang</button>
</div>
</div>


<!-- Navbar -->
<nav class="navbar"><div class="wrap">
<a href="index.html"><span>Home</span><span class="dot"></span></a>
<a href="shop.html"><span>Toko</span><span class="dot"></span></a>
<a href="my-products.html"><span>Produk</span><span class="dot"></span></a>
<a href="team.html"><span>Team</span><span class="dot"></span></a>
<a href="account.html"><span>Akun</span><span class="dot"></span></a>
</div></nav>


<script type="module">
import { setActiveNav, loadProducts, closeModal } from './js/app.js';
setActiveNav();
loadProducts();
document.getElementById('mClose').onclick = closeModal;
window.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
</script>
</body>
</html>
